<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory — Vendit Inventory</title>
  <link rel="icon" href="/static/img/favicon.ico">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/static/js/app.js"></script>
  <script>
    if (requireAuth()) {
      renderShell("/inventory.html");
      const main = document.getElementById("main-content");
      main.innerHTML = `
        <div class="page-header">
          <div><h1>Inventory</h1><p class="page-sub">SKUs, stock on hand, and reorder points</p></div>
          ${isAdmin() ? '<button id="add-btn">+ Add Product</button>' : ''}
        </div>
        <div id="toast-area"></div>
        <div class="toolbar">
          <input type="text" id="search" placeholder="Search name, SKU, or barcode…">
          <input type="text" id="barcode-scan" placeholder="Scan barcode to find…" autocomplete="off" style="max-width:220px;">
          <select id="low-stock-filter">
            <option value="">All products</option>
            <option value="1">Low stock only</option>
          </select>
        </div>
        <div class="card" style="padding:0;">
          <table id="products-table">
            <thead><tr>
              <th>SKU</th><th>Name</th><th>Category</th><th class="num">On Hand</th>
              <th class="num">Reorder At</th><th class="num">Cost</th><th class="num">Sell</th><th></th>
            </tr></thead>
            <tbody><tr><td colspan="8" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div>
      `;
      document.getElementById("search").addEventListener("input", debounce(load, 300));
      document.getElementById("low-stock-filter").addEventListener("change", load);
      document.getElementById("barcode-scan").addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const code = e.target.value.trim();
        e.target.value = "";
        if (!code) return;
        document.getElementById("search").value = code;
        load();
      });
      if (isAdmin()) document.getElementById("add-btn").addEventListener("click", () => openModal());
      load();
    }

    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    let allProducts = [];

    async function load() {
      const q = document.getElementById("search").value.trim();
      const lowStock = document.getElementById("low-stock-filter").value;
      const params = new URLSearchParams();
      if (q) params.set("q", q);
      if (lowStock) params.set("low_stock", lowStock);
      try {
        allProducts = await api("/products?" + params.toString());
        renderTable();
      } catch (err) { toast(err.message); }
    }

    function renderTable() {
      const rows = allProducts.map((p) => `
        <tr>
          <td>${escapeHtml(p.sku)}</td>
          <td>${escapeHtml(p.name)}</td>
          <td>${escapeHtml(p.category || '')}</td>
          <td class="num">${p.quantity_on_hand <= p.reorder_point ? `<span class="badge amber">${p.quantity_on_hand}</span>` : p.quantity_on_hand}</td>
          <td class="num">${p.reorder_point}</td>
          <td class="num">${money(p.cost_price)}</td>
          <td class="num">${money(p.sell_price)}</td>
          <td>${isAdmin() ? `<button class="secondary small" onclick="openModal(${p.id})">Edit</button>` : ''}</td>
        </tr>
      `).join("") || '<tr><td colspan="8" class="empty-state">No products found.</td></tr>';
      document.getElementById("products-table").querySelector("tbody").innerHTML = rows;
    }

    function openModal(id) {
      const p = id ? allProducts.find((x) => x.id === id) : null;
      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      backdrop.innerHTML = `
        <div class="modal">
          <h2>${p ? "Edit Product" : "Add Product"}</h2>
          <div id="modal-toast"></div>
          <form id="product-form">
            <div class="form-grid">
              <div class="field"><label>SKU</label><input name="sku" value="${escapeHtml(p ? p.sku : '')}" required></div>
              <div class="field"><label>Barcode</label><input name="barcode" value="${escapeHtml(p && p.barcode ? p.barcode : '')}" placeholder="Scan or type…"></div>
              <div class="field" style="grid-column:1/-1;"><label>Name</label><input name="name" value="${escapeHtml(p ? p.name : '')}" required></div>
              <div class="field"><label>Category</label><input name="category" value="${escapeHtml(p && p.category ? p.category : '')}"></div>
              <div class="field"><label>Unit</label><input name="unit" value="${escapeHtml(p ? p.unit : 'ea')}"></div>
              <div class="field"><label>Cost Price</label><input name="cost_price" type="number" step="0.01" value="${p ? p.cost_price : 0}"></div>
              <div class="field"><label>Sell Price</label><input name="sell_price" type="number" step="0.01" value="${p ? p.sell_price : 0}"></div>
              <div class="field"><label>Reorder Point</label><input name="reorder_point" type="number" value="${p ? p.reorder_point : 0}"></div>
              ${!p ? '<div class="field"><label>Opening Quantity</label><input name="quantity_on_hand" type="number" value="0"></div>' : ''}
            </div>
            <div class="modal-actions">
              <button type="button" class="secondary" id="cancel-btn">Cancel</button>
              <button type="submit">${p ? "Save Changes" : "Create Product"}</button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(backdrop);
      backdrop.querySelector("#cancel-btn").addEventListener("click", () => backdrop.remove());
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) backdrop.remove(); });

      backdrop.querySelector("#product-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = Object.fromEntries(fd.entries());
        try {
          if (p) {
            await api(`/products/${p.id}`, { method: "PATCH", body: JSON.stringify(payload) });
          } else {
            await api("/products", { method: "POST", body: JSON.stringify(payload) });
          }
          backdrop.remove();
          toast(p ? "Product updated." : "Product created.", "success");
          load();
        } catch (err) {
          backdrop.querySelector("#modal-toast").innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
        }
      });
    }
  </script>
</body>
</html>
