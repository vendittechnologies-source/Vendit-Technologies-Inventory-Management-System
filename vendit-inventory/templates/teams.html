<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teams — Vendit Inventory</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/static/js/app.js"></script>
  <script>
    if (requireAuth()) {
      renderShell("/teams.html");
      const main = document.getElementById("main-content");
      main.innerHTML = `
        <div class="page-header">
          <div><h1>Teams</h1><p class="page-sub">Internal teams that draw stock directly (not via machine filling)</p></div>
          ${isAdmin() ? '<button id="add-btn">+ Add Team</button>' : ''}
        </div>
        <div id="toast-area"></div>
        <div class="card" style="padding:0;">
          <table id="table">
            <thead><tr><th>Name</th><th>Status</th><th></th></tr></thead>
            <tbody><tr><td colspan="3" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div>
      `;
      if (isAdmin()) document.getElementById("add-btn").addEventListener("click", () => openModal());
      load();
    }

    let items = [];
    async function load() {
      try {
        items = await api("/teams?include_inactive=1");
        document.getElementById("table").querySelector("tbody").innerHTML = items.map((t) => `
          <tr>
            <td>${escapeHtml(t.name)}</td>
            <td>${t.active ? '<span class="badge teal">Active</span>' : '<span class="badge gray">Inactive</span>'}</td>
            <td>${isAdmin() ? `<button class="secondary small" onclick="openModal(${t.id})">Edit</button>` : ''}</td>
          </tr>
        `).join("") || '<tr><td colspan="3" class="empty-state">No teams yet.</td></tr>';
      } catch (err) { toast(err.message); }
    }

    function openModal(id) {
      const t = id ? items.find((x) => x.id === id) : null;
      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      backdrop.innerHTML = `
        <div class="modal">
          <h2>${t ? "Edit Team" : "Add Team"}</h2>
          <div id="modal-toast"></div>
          <form id="form">
            <div class="field"><label>Name</label><input name="name" value="${escapeHtml(t ? t.name : '')}" required></div>
            ${t ? `<div class="field"><label>Status</label><select name="active"><option value="1" ${t.active ? 'selected' : ''}>Active</option><option value="0" ${!t.active ? 'selected' : ''}>Inactive</option></select></div>` : ''}
            <div class="modal-actions">
              <button type="button" class="secondary" id="cancel-btn">Cancel</button>
              <button type="submit">${t ? "Save Changes" : "Add Team"}</button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(backdrop);
      backdrop.querySelector("#cancel-btn").addEventListener("click", () => backdrop.remove());
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) backdrop.remove(); });
      backdrop.querySelector("#form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = Object.fromEntries(new FormData(e.target).entries());
        if ("active" in payload) payload.active = payload.active === "1";
        try {
          if (t) await api(`/teams/${t.id}`, { method: "PATCH", body: JSON.stringify(payload) });
          else await api("/teams", { method: "POST", body: JSON.stringify(payload) });
          backdrop.remove();
          toast(t ? "Team updated." : "Team added.", "success");
          load();
        } catch (err) {
          backdrop.querySelector("#modal-toast").innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
        }
      });
    }
  </script>
</body>
</html>
